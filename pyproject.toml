[project]
name = "linkforge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "jinja2>=3.1.0",
    "litellm>=1.83.0",
    "openai-agents[litellm]>=0.14.6",
    "ruff>=0.15.10",
    "telegramify-markdown>=1.1.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.pyright]
typeCheckingMode = "off"
