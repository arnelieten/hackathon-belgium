[project]
name = "linkforge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agno>=2.2.0",
    "fastapi[standard]>=0.135.3",
    "google-genai>=1.50.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.pyright]
typeCheckingMode = "off"
